function stopNet(){clearInterval(hbT);clearTimeout(judgeT);hbT=judgeT=0;if(hbUn){hbUn();hbUn=null}if(netG&&rtdb&&me)F.remove(hbRef(netC)).catch(()=>{});netG='';HBV=0;HBR=0}
function armJudge(){clearTimeout(judgeT);if(!netG||!HBR)return;const g=C()&&C().games[netG];if(!g)return;const t=Math.max(HBV||0,g.t0||0);judgeT=setTimeout(judge,Math.max(0,t+HBMS-NOW())+60)}
function judge(){if(!netG||!HBR)return;const id=netG,g=C()&&C().games[id];if(!g||g.st!='play')return;const t=Math.max(HBV||0,g.t0||0);
 if(NOW()-t>=HBMS)mut(()=>{const h=C().games[id];if(h&&h.st=='play')fin(h,'d','연결 끊김')});else armJudge()}
function net(g){const ok=g&&g.st=='play'&&col(g)&&g.black!='ai'&&g.white!='ai'&&!M();if(!ok){if(netG)stopNet();return}
 if(netG==g.id)return;stopNet();netG=g.id;netC=col(g);netP=netC=='b'?'w':'b';beat();hbT=setInterval(beat,3000);
 hbUn=F.onValue(F.ref(rtdb,'hb/'+me.cls+'/'+g.id+'/'+netP),s=>{HBV=+s.val()||0;HBR=1;armJudge()})}
function tmShow(){const e=$('tm'),g=curG;if(e)e.textContent=g&&g.st=='play'&&g.dl&&!g.demo?'⏱ '+Math.min(lim(g)/1000,Math.max(0,Math.ceil((g.dl-NOW())/1000)))+'초':''}
function arm(g){const k=g&&g.st=='play'&&g.dl?g.id+':'+g.n:'';
 if(k!==armK){clearTimeout(dlT);clearInterval(tickT);dlT=tickT=0;armK=k;
  if(k){tickT=setInterval(tmShow,1000);if(col(g)==g.turn)dlT=setTimeout(()=>{load();const h=C()&&C().games[g.id];if(h&&h.st=='play'&&h.n==g.n&&NOW()>=h.dl)mut(()=>fin(C().games[g.id],h.turn=='b'?'w':'b','시간 초과'))},Math.max(0,g.dl-NOW())+50)}}
 tmShow()}
function sync(g){curG=g;invCheck();fitN();if(g){const p=SS[g.id];SS[g.id]=g.st;if(g.st=='done'&&p=='play'&&col(g)&&!g.demo)resSnd(g)}net(g);arm(g);document.body.classList.toggle('gm',!!g);
 if(g&&g.st=='done'&&col(g)&&!g.demo&&!autoT){const id=g.id;autoT=setTimeout(()=>{autoT=0;if(gid==id){gid=null;sel=[];render(1)}},Math.max(0,lockUntil-NOW())+(g.why=='기권'&&g.winner==col(g)?3000:2500))}}
let lastH='',lastK='';
function setApp(h,k,f){const A=$('app');if(!f&&h===lastH&&A.firstChild)return;const same=k===lastK&&A.firstChild;
 const all=A.querySelectorAll('*'),sc=[];if(same)for(let i=0;i<all.length;i++){const e=all[i];if(e.scrollTop>0&&e.scrollHeight>e.clientHeight)sc.push([i,e.scrollTop,e.scrollLeft])}
 const top=A.scrollTop;A.classList.toggle('rr',!!same);A.innerHTML=h;lastH=h;lastK=k;
 if(same){const n=A.querySelectorAll('*');sc.forEach(([i,t,l])=>{const e=n[i];if(e){e.scrollTop=t;e.scrollLeft=l}});A.scrollTop=top}}
function render(f){const a=document.activeElement;if(!f&&a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName))return;load();
 if(!READY)return setApp(loadV(),'load',f);if(M()&&!db.classes[cur])cur=firstCls();
 if(!me){sync(null);return setApp(loginV(),'login',f)}if(!M()&&!C())return setApp(loadV(),'load',f);if(!M()&&!C().students[me.id]){clearTimeout(gone);gone=setTimeout(()=>{if(me&&!M()&&C()&&!C().students[me.id]){err='계정이 삭제되었어요.';logout()}},4000);return setApp(loadV(),'load',f)}
 if(!gid&&!M()&&C()){const r=Object.values(C().games).find(x=>x.st=='play'&&(x.black==me.id||x.white==me.id));if(r){gid=r.id;sel=[];modal=''}}
 if(gid&&!(C()&&C().games[gid]))gid=null;const g=gid&&C()&&C().games[gid];
 if(g&&$('bd')&&$('bd').dataset.g==gid){$('gp').innerHTML=panel(g);$('gc').innerHTML=ctrl(g);syncBoard(g);sync(g);popSync(g);return aiCheck(g)}
 setApp(M()&&!C()?teacherV():g?gameV(g):M()?teacherV():studentV(),(M()?'m':'s')+'|'+(g?g.id:'')+'|'+tab+'|'+modal+'|'+dtab,f);if(g){shownG=null;syncBoard(g);aiCheck(g)}sync(g||null);popSync(g||null)}
let rq=0;function renderSoon(){if(rq)return;rq=1;Promise.resolve().then(()=>{rq=0;render()})}
document.addEventListener('visibilitychange',()=>{document.body.classList.toggle('hid',document.hidden);if(!document.hidden)render()});
function fitN(){document.querySelectorAll('.nmp,.tx small').forEach(e=>{e.style.fontSize='';let f=parseFloat(getComputedStyle(e).fontSize),n=0;while(e.scrollWidth>e.clientWidth+1&&f>7&&n++<30){f-=.5;e.style.fontSize=f+'px'}})}
addEventListener('resize',()=>fitN());
fbInit();
</script></body></html>
